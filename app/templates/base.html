<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VisionGuard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>

<body>
    <div class="bg" aria-hidden="true">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
        <div class="grid"></div>
    </div>
    <div class="spot" aria-hidden="true"></div>

    <header class="nav">
        <a class="brand" href="{{ url_for('main.index') }}">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z" />
                <circle cx="12" cy="11" r="3" />
            </svg>
            VisionGuard
        </a>
        <nav>
            <a class="{{ 'active' if request.endpoint == 'main.index' else '' }}"
                href="{{ url_for('main.index') }}">Analyze</a>
            <a class="{{ 'active' if request.endpoint == 'main.history' else '' }}"
                href="{{ url_for('main.history') }}">History</a>
        </nav>
    </header>

    <main class="wrap">{% block content %}{% endblock %}</main>

    <footer class="foot">VisionGuard · AI-generated vs real image detection · estimates, not proof</footer>
</body>

</html>
