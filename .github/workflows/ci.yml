name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8 pytest -r requirements-web.txt
      - run: flake8 app --max-line-length 100
      - run: pytest tests/
      - run: docker build -t visionguard-web .